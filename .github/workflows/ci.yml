name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv==0.8.15
          uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/finance apps
      - name: Pytest
        run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Build
        run: npm run build

  reference-scenario-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_test
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_test
      APP_ENV: test
      RATE_LIMIT_PER_MINUTE: "0"
      APP_LOCK_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv==0.8.15
          uv sync --frozen --extra dev
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Reference financial scenario
        run: >-
          uv run pytest
          tests/integration/test_reference_financial_scenario_postgres.py
          -m postgres_integration --no-cov

  security-audit:
    runs-on: ubuntu-latest
    # Non-blocking — surfaces known CVEs without failing the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict --progress-spinner off || true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true
