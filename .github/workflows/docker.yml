name: Docker build

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "apps/web/.dockerignore"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "apps/web/.dockerignore"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: personal-finance-ci
      POSTGRES_PASSWORD: ci-compose-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml config --quiet
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build api web
      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-finance-ci-api:latest
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
      - name: Scan web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-finance-ci-web:latest
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
          skip-setup-trivy: true
