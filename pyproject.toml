[project]
name = "finance"
version = "0.1.0"
description = "Self-hosted personal finance analysis system with ML and local LLM"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
dependencies = [
    # web / api
    "fastapi>=0.140.0,<0.141",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.4",
    # data / ml
    "pandas>=3.0.5",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14",
    "joblib>=1.4",
    # observability / llm-client
    "structlog>=25.5.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
augment = [
    "ollama>=0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "hypothesis>=6.161.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends/File/Form pattern legitimately uses calls in defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not postgres_integration' --cov=src/finance --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=60"
pythonpath = ["src"]
markers = [
    "postgres_integration: tests requiring a dedicated PostgreSQL database",
]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
