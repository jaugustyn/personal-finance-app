[project]
name = "finance"
version = "0.1.0"
description = "Self-hosted personal finance analysis system with ML and local LLM"
requires-python = ">=3.11"
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # data / ml
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "joblib>=1.4",
    # assets
    "yfinance>=0.2.40",
    # observability / scheduling / llm-client
    "structlog>=24.4",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
augment = [
    "ollama>=0.3",
]
experiments = [
    "pmdarima>=2.0",
    "prophet>=1.1.6",
    "chromadb>=0.5",
    "sentence-transformers>=3.2",
    "pyarrow>=17.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "hypothesis>=6",
    "ollama>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends/File/Form pattern legitimately uses calls in defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/finance --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=60"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
